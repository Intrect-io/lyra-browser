name: Release

# A v* tag publishes that version: PyPI first, because the npm launcher installs
# lyra-browser==<its own version> from PyPI, then npm. Both authenticate with
# short-lived OIDC credentials; no token is stored in the repository.
#
# 0.1.2, the first version of both packages, was uploaded by hand with account tokens,
# because a package has to exist before a trusted publisher can be attached to it
# (npm: unconfirmed whether it can be set earlier). Setup for the first tagged release,
# by a person, with the same values for both registries (workflow release.yml):
#   PyPI  pypi.org -> project lyra-browser -> Publishing -> add a trusted publisher:
#         owner Intrect-io, repository lyra-browser, environment pypi.
#   npm   npmjs.com -> @intrect/lyra-browser -> Settings -> Trusted Publisher:
#         Intrect-io/lyra-browser, environment npm. Then set the repository variable
#         NPM_OIDC to true, which turns the npm and smoke jobs on.
# Then revoke the account tokens that uploaded 0.1.2. Until the PyPI publisher exists,
# the pypi job below fails on a tag push.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

# Two releases at once would race for the same names; the second waits.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tagged commit is on master
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/master
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
      - name: The tag, pyproject.toml and npm/package.json name one version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          py="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          js="$(node -p "require('./npm/package.json').version")"
          if [ "$tag" != "$py" ] || [ "$tag" != "$js" ]; then
            echo "tag $tag, pyproject.toml $py, npm/package.json $js" >&2
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,uat]"
      - name: Lint
        run: ruff check .
      - name: npx constraints match uv.lock
        run: scripts/npm-constraints.sh | diff - npm/constraints.txt
      - name: Test
        run: pytest -q
      - name: Launcher tests
        run: npm test
        working-directory: npm

  # Building downloads build dependencies, so it runs without the OIDC permission;
  # the job that can publish only downloads the finished files and runs the publisher.
  build:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
      - name: Build
        run: uv build
      - name: The build is the version the tag names, and only that
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          ls dist
          test -f "dist/lyra_browser-${VERSION}-py3-none-any.whl"
          test -f "dist/lyra_browser-${VERSION}.tar.gz"
          test "$(ls dist | wc -l)" = 2
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  pypi:
    needs: [gate, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    needs: [gate, pypi]
    if: vars.NPM_OIDC == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Compared here, not with a downloaded tool: this job can mint an OIDC token.
      - name: npm is new enough for trusted publishing (11.5.1 or later)
        run: |
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!ok) {
              console.error("npm " + process.argv[1] + " cannot publish with OIDC");
              process.exit(1);
            }
          ' "$(npm --version)"
      # The simple index is what uv reads, with the same Accept header. The JSON API
      # (/pypi/<name>/<version>/json) answered 200 minutes before uv could resolve the
      # release on 0.1.2 (measured 2026-10-19), so it is not evidence the launcher works.
      - name: The release resolves from PyPI's simple index, where the launcher installs it from
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          pattern="lyra_browser-${VERSION//./\.}(-|\.tar\.gz)"
          accept="application/vnd.pypi.simple.v1+json, application/vnd.pypi.simple.v1+html;q=0.2, text/html;q=0.01"
          for attempt in $(seq 1 30); do
            if curl -fsS -H "Accept: ${accept}" "https://pypi.org/simple/lyra-browser/" | grep -Eq "${pattern}"; then
              exit 0
            fi
            sleep 10
          done
          echo "lyra-browser ${VERSION} is not in PyPI's simple index" >&2
          exit 1
      - name: Publish
        run: npm publish --provenance --access public
        working-directory: npm

  smoke:
    needs: [gate, npm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.8"
      - name: The published launcher starts the published server
        env:
          VERSION: ${{ needs.gate.outputs.version }}
        run: |
          for attempt in $(seq 1 12); do
            if npx --yes "@intrect/lyra-browser@${VERSION}" --help; then
              exit 0
            fi
            sleep 15
          done
          echo "@intrect/lyra-browser@${VERSION} did not start" >&2
          exit 1
