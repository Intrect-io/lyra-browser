name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,uat]"
      - name: Lint
        run: ruff check .
      # Formatting is the pre-commit hook's job (ruff-format), so it is not repeated here.
      # What only a PR can do is test the merged tree. The unit suite runs on fakes: no
      # browser is launched, so no Playwright download. The real-browser gates stay manual
      # (scripts/verify_*_e2e.py).
      - name: Test
        run: pytest -q
