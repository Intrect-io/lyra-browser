name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# A newer push to the same branch makes the older run moot.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Runs take about 2.5 minutes; a hang should not hold a runner for six hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,uat]"
      - name: Lint
        run: ruff check .
      # Formatting is the pre-commit hook's job (ruff-format), so it is not repeated here.
      # What only a PR can do is test the merged tree. The unit suite runs on fakes: no
      # browser is launched, so no Playwright download. The real-browser gates stay manual
      # (scripts/verify_*_e2e.py).
      - name: Test
        run: pytest -q
