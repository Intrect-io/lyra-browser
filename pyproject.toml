[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lyra-browser"
version = "0.1.3"
description = "lyra: an MCP server that gives an agent a persistent, logged-in Chromium the user can watch and take over, with every site change, form send, upload and download asked first."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "unohee" }]
keywords = ["mcp", "playwright", "browser-automation", "lyra", "co-browsing"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Browsers",
]

# fastmcp tracks the VEGA harness (3.2.0). No Playwright here: the default driver
# (`native`) drives the Chrome or Edge already on the machine over raw DevTools, so a
# plain install needs no browser download. Playwright is an extra for the drivers that
# want it, and is what `auto` falls back to on a machine with no browser at all.
dependencies = [
    "fastmcp>=3.2,<4",
    "pydantic>=2.6,<3",
]

[project.optional-dependencies]
# The Playwright drivers. Held at 1.59, one minor above what the VEGA harness used to
# bundle (1.58.0): element refs (`aria_snapshot(mode="ai")`) arrive in 1.59.
playwright = [
    "playwright>=1.59,<2",
]
dev = [
    # The real-browser gates run both drivers, so developing means having both.
    "playwright>=1.59,<2",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "pre-commit>=3.7",
]
# A drop-in Playwright fork that does not send Runtime.enable, the one CDP
# call Kasada refuses on; session.load_driver prefers it when
# it is installed; nothing else changes.
patchright = [
    "patchright>=1.63,<2",
]
# UAT mode (lyra_browser.uat): persona-driven acceptance runs with an LLM
# "brain". The core server never imports these; each brain imports its SDK
# lazily, so a server installed without this extra is unchanged.
uat = [
    "anthropic>=1,<2",
    "openai>=1.60,<4",
    "pyyaml>=6,<7",
]

[project.scripts]
lyra-browser = "lyra_browser.__main__:main"
lyra-uat = "lyra_browser.uat.cli:main"

[project.urls]
Homepage = "https://github.com/Intrect-io/lyra-browser"
Repository = "https://github.com/Intrect-io/lyra-browser"
Issues = "https://github.com/Intrect-io/lyra-browser/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/lyra_browser"]

# The sdist is what PyPI publishes, so it names what goes in rather than taking the whole
# tree: untracked local files (plans, scratch dirs) are not gitignored and would ship.
# tests/ stays out because several read files outside the package (the plugin manifest,
# npm/), which an unpacked sdist does not have.
[tool.hatch.build.targets.sdist]
include = ["/src", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
